<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雯雯 & 方通 | 婚礼倒计时</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:wght@700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #2b1d3b, #4a2c5a, #1e1a2e);
      color: #f5e8c7;
      font-family: 'Noto Serif SC', serif;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    canvas { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: 1; 
      pointer-events: none; 
      opacity: 0.7;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 620px;
      margin: 40px auto;
      padding: 40px 30px;
      background: rgba(20, 15, 35, 0.85);
      border-radius: 60px;
      border: 3px solid #d4af37;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
    }

    .title {
      font-size: 2.8rem;
      color: #f5d76e;
      text-shadow: 0 0 20px rgba(245, 215, 110, 0.6);
      margin: 10px 0;
    }

    .names {
      font-size: 3.2rem;
      font-weight: 700;
      color: #f5e8c7;
      margin: 15px 0 8px;
      letter-spacing: 4px;
    }

    .subtitle {
      font-size: 1.1rem;
      background: rgba(212, 175, 55, 0.2);
      display: inline-block;
      padding: 8px 25px;
      border-radius: 30px;
      margin-bottom: 30px;
    }

    .countdown {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
      flex-wrap: wrap;
    }

    .time-box {
      background: rgba(0,0,0,0.4);
      border: 2px solid #d4af37;
      border-radius: 25px;
      padding: 15px 20px;
      min-width: 110px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .number {
      font-size: 3.8rem;
      font-weight: bold;
      color: #f5e8c7;
      line-height: 1;
    }

    .unit {
      font-size: 1.1rem;
      color: #d4af37;
      margin-top: 5px;
    }

    .date {
      font-size: 1.1rem;
      margin: 20px 0;
      opacity: 0.9;
    }

    .blessing {
      font-size: 1.6rem;
      color: #f5d76e;
      margin: 25px 0 10px;
      line-height: 1.6;
    }

    .heart {
      color: #ff6b9d;
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="container">
    <div>♦ 囍 ♦</div>
    <div class="names">雯雯 & 方通</div>
    <div class="subtitle">距离雯雯和方通结婚还有</div>

    <div class="countdown" id="countdown">
      <!-- JS 会自动生成 -->
    </div>

    <div class="date">
      📅 2026年5月26日 凌晨 00:00
    </div>

    <div class="blessing">
      新婚快乐 · 白头偕老<br>
      <span class="heart">♥</span> 愿岁月温柔，情深共白首 <span class="heart">♥</span>
    </div>
  </div>

  <script>
    // 花瓣/光点效果
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const particles = [];
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 6 + 3;
        this.speedX = Math.random() * 0.5 - 0.25;
        this.speedY = Math.random() * 0.8 + 0.4;
        this.opacity = Math.random() * 0.6 + 0.4;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        if (this.y > canvas.height) this.y = 0;
      }
      draw() {
        ctx.fillStyle = `rgba(245, 232, 199, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 80; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // 倒计时
    function updateCountdown() {
      const weddingDate = new Date('2026-05-26T00:00:00').getTime();
      const now = new Date().getTime();
      const diff = weddingDate - now;

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerHTML = `
        <div class="time-box"><div class="number">${days.toString().padStart(2,'0')}</div><div class="unit">天</div></div>
        <div class="time-box"><div class="number">${hours.toString().padStart(2,'0')}</div><div class="unit">时</div></div>
        <div class="time-box"><div class="number">${minutes.toString().padStart(2,'0')}</div><div class="unit">分</div></div>
        <div class="time-box"><div class="number">${seconds.toString().padStart(2,'0')}</div><div class="unit">秒</div></div>
      `;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
