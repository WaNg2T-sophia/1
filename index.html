<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雯雯 & 方通 婚礼倒计时</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
    
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1, #fff0f5, #e0b0ff);
      font-family: 'Comic Neue', cursive;
      text-align: center;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    canvas { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      z-index: 1; 
      pointer-events: none; 
    }

    .container { 
      position: relative; 
      z-index: 2; 
      padding-top: 30px; 
    }

    h1 { 
      font-size: 3.2rem; 
      color: #ff4d94; 
      text-shadow: 4px 4px 0 #fff; 
      margin: 10px 0 8px; 
    }
    
    .subtitle { 
      font-size: 1.7rem; 
      color: #d46eff; 
      margin-bottom: 20px; 
      text-shadow: 2px 2px 4px rgba(255,255,255,0.7);
    }
    
    .main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      margin: 20px 0 30px;
      flex-wrap: wrap;
    }
    
    .photos img {
      width: 260px;
      border-radius: 35px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
      transition: transform 0.4s;
      cursor: pointer;
    }
    
    .photos img:hover { transform: scale(1.08); }

    .countdown {
      font-size: 4.8rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 6px 6px 0 #c81e6c, -3px -3px 0 #c81e6c;
      background: rgba(255,255,255,0.65);
      border-radius: 40px;
      padding: 25px 50px;
      box-shadow: 0 12px 0 #ff4d94;
      animation: bounce 1.8s infinite alternate;
      display: inline-block;
      min-width: 420px;
    }

    .label { 
      font-size: 2.1rem; 
      color: #ff4d94; 
      margin: 20px 0; 
    }

    .emoji { font-size: 3.8rem; animation: float 3s infinite ease-in-out; }

    @keyframes bounce { 
      from { transform: translateY(0); } 
      to { transform: translateY(-18px); } 
    }
    
    @keyframes float { 
      0%,100% { transform: translateY(0); } 
      50% { transform: translateY(-15px); } 
    }
  </style>
</head>

    <div class="label">2026年5月26日 凌晨 00:00 <span class="emoji">✨</span></div>

    <div class="main-content">

        <img src="https://wang2t-sophia.github.io/1/photo2.jpg" alt="我们">
      </div>
    </div>
  </div>
