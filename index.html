<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雯雯和方通结婚倒计时</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Playfair+Display:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff0f5 0%, #f0f8ff 100%);
            font-family: 'Noto Serif SC', serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 浪漫背景装饰 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 182, 193, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(173, 216, 230, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            text-align: center;
            max-width: 720px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
            z-index: 2;
            border: 1px solid #ffe4e1;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #d6708c;
            margin: 0 0 20px 0;
            text-shadow: 0 2px 4px rgba(214, 112, 140, 0.1);
        }

        .emoji-top {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.35rem;
            color: #5a8ab8;           /* 更协调的柔和蓝 */
            margin: 15px 0 25px 0;
            font-weight: 500;
        }

        .date {
            font-size: 1.25rem;
            color: #777;
            margin-bottom: 30px;
        }

        /* 倒计时 - 主色改为温暖的金粉色，更协调且醒目 */
        .countdown {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .time-block {
            background: linear-gradient(145deg, #fff7e6, #ffe4d1);
            padding: 18px 22px;
            border-radius: 16px;
            min-width: 110px;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.25);
            border: 2px solid #ffd4b3;
        }

        .time-number {
            font-size: 2.8rem;
            font-weight: 700;
            color: #e88a5e;           /* 温暖醒目的橙粉色 */
            line-height: 1;
            text-shadow: 0 2px 6px rgba(232, 138, 94, 0.2);
        }

        .time-label {
            font-size: 0.95rem;
            color: #8b6f5e;
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .heart {
            color: #ff6b81;
            font-size: 1.8rem;
            margin: 25px 0;
        }

        .blessing {
            font-size: 1.45rem;
            color: #d6708c;
            margin: 20px 0;
            font-weight: 500;
        }

        .emoji-bottom {
            font-size: 2.2rem;
            margin-top: 30px;
            letter-spacing: 8px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .countdown {
                gap: 15px;
            }
            .time-block {
                min-width: 85px;
                padding: 14px 16px;
            }
            .time-number {
                font-size: 2.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-top">💒 🎉</div>
        
        <h1>雯雯和方通结婚倒计时</h1>
        
        <div class="subtitle">距离我们的幸福时刻还有</div>
        
        <div class="date">2026年5月26日 凌晨 00:00</div>
        
        <div class="countdown" id="countdown">
            <!-- JS 会动态填充 -->
        </div>
        
        <div class="heart">❤️</div>
        
        <div class="blessing">新婚快乐！白头偕老 ❤️</div>
        
        <div class="emoji-bottom">💖 🦄 🎈 🌈 💍 ✨</div>
    </div>

    <script>
        // 目标日期：2026-05-26 00:00:00
        const targetDate = new Date('2026-05-26T00:00:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = `
                    <div style="font-size:2rem;color:#d6708c;">🎉 我们已经结婚啦！🎉</div>
                `;
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('countdown').innerHTML = `
                <div class="time-block">
                    <div class="time-number">${days}</div>
                    <div class="time-label">天</div>
                </div>
                <div class="time-block">
                    <div class="time-number">${hours.toString().padStart(2, '0')}</div>
                    <div class="time-label">小时</div>
                </div>
                <div class="time-block">
                    <div class="time-number">${minutes.toString().padStart(2, '0')}</div>
                    <div class="time-label">分钟</div>
                </div>
                <div class="time-block">
                    <div class="time-number">${seconds.toString().padStart(2, '0')}</div>
                    <div class="time-label">秒</div>
                </div>
            `;
        }

        // 每秒更新
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
