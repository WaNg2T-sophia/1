<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>雯雯和方通结婚倒计时</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap');
    
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffb6c1, #ffe4e1, #fff0f5, #e0b0ff);
      font-family: 'Comic Neue', cursive;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      padding-top: 40px;
    }
    
    h1 {
      font-size: 2.9rem;
      color: #ff4d94;
      text-shadow: 4px 4px 0 #fff;
      margin: 10px 0 8px 0;
    }
    
    .subtitle {
      font-size: 1.65rem;
      color: #6b4eff;
      margin-bottom: 30px;
    }
    
    .main-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 45px;
      margin: 20px 0 40px 0;
    }
    
    .photos img {
      width: 260px;
      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      transition: transform 0.4s;
      cursor: pointer;
    }
    
    .photos img:hover {
      transform: scale(1.06);
    }
    
    .countdown {
      font-size: 4.9rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 8px 8px 0 #c81e6c, -4px -4px 0 #c81e6c;
      background: rgba(255,255,255,0.45);
      border-radius: 40px;
      padding: 28px 60px;
      display: inline-block;
      box-shadow: 0 15px 0 #ff4d94;
      animation: bounce 1.8s infinite alternate;
      min-width: 420px;
    }
    
    .label {
      font-size: 2.2rem;
      color: #ff4d94;
      margin: 20px 0 30px 0;
    }

    .emoji {
      font-size: 4rem;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
  </style>
</head>
<body>

  <canvas id="petals"></canvas>

  <div class="container">
    <div class="emoji">💒 🎉</div>
    <h1>距离雯雯和方通结婚还有</h1>
    <div class="subtitle">2026年5月26日 凌晨00:00</div>
    
    <div class="main-content">
      <div class="photos">
        <img src="photo1.jpg" alt="婚纱照1" onclick="showModal(this)">
      </div>
      
      <div class="countdown" id="timer">加载中...</div>
      
      <div class="photos">
        <img src="photo2.jpg" alt="婚纱照2" onclick="showModal(this)">
      </div>
    </div>
    
    <div class="label">❤️ 新婚快乐！白头偕老 ❤️</div>
    <div class="emoji">💖 🦄 🎈 🌈 💍 ✨</div>
  </div>

  <div id="modal" onclick="hideModal()" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:1000; align-items:center; justify-content:center;">
    <img id="modalImage" src="" style="max-width:92%; max-height:92%; border-radius:20px;">
  </div>

  <script>
    const endTime = new Date('2026-05-26T00:00:00+08:00').getTime();
    const timerEl = document.getElementById('timer');

    function updateCountdown() {
      const now = new Date().getTime();
      const distance = endTime - now;

      if (distance < 0) {
        timerEl.innerHTML = "新婚快乐！💒🎊";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      timerEl.innerHTML = `${days}天 ${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    let petals = [];
    const petalCount = 66;

    const emojis = ['🌹', '💖', '❤️', '🌸', '💗'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    class Petal {
      constructor() { this.reset(); }
      
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height - canvas.height;
        this.size = Math.random() * 22 + 14;
        this.speed = Math.random() * 2.8 + 1.3;
        this.rotation = Math.random() * 360;
        this.rotationSpeed = Math.random() * 5 - 2.5;
        this.opacity = Math.random() * 0.75 + 0.45;
        this.swing = Math.random() * 1.8 + 0.9;
        this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
      }

      update() {
        this.y += this.speed;
        this.x += Math.sin(this.y / 45) * this.swing;
        this.rotation += this.rotationSpeed;
        if (this.y > canvas.height + 50) this.reset();
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation * Math.PI / 180);
        ctx.globalAlpha = this.opacity;
        ctx.font = `${this.size}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.emoji, 0, 0);
        ctx.restore();
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let petal of petals) {
        petal.update();
        petal.draw();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < petalCount; i++) {
      petals.push(new Petal());
    }
    animate();

    function showModal(img) {
      document.getElementById('modalImage').src = img.src;
      document.getElementById('modal').style.display = 'flex';
    }

    function hideModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
