    body {

      text-align: center;

      pointer-events: none;

      position: relative;

      justify-content: center;

      margin: 20px 0 40px 0;

    .photos img {

      border-radius: 35px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);

      cursor: pointer;

    .photos img:hover {
      transform: scale(1.06);
    }
    
    .countdown {

      font-weight: bold;

      padding: 28px 60px;

      box-shadow: 0 15px 0 #ff4d94;
      animation: bounce 1.8s infinite alternate;
      min-width: 420px;
    }

      color: #ff4d94;
      margin: 20px 0 30px 0;
    }
